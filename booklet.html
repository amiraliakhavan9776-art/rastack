<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کاتالوگ رستاک</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100vh;width:100vw;overflow:hidden;
  background:linear-gradient(135deg,#0B1E33 0%,#1a2f4a 100%);
  font-family:'Vazirmatn',sans-serif;
  display:flex;align-items:center;justify-content:center;
}
#flipbook{box-shadow:0 20px 60px rgba(0,0,0,.7);border-radius:4px}
.page{background:#fff;overflow:hidden;position:relative}
.page img{width:100%;height:100%;object-fit:contain;display:block}

/* Progress bar */
#progressWrap{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  width:60%;max-width:400px;height:3px;
  background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;z-index:99;
}
#progressBar{
  height:100%;width:0;background:linear-gradient(90deg,#D4AF37,#E8D8A8);
  transition:width .1s linear;
}

/* Nav */
.nav{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:12px;align-items:center;z-index:99;
}
.nav button{
  background:rgba(11,30,51,.9);color:#D4AF37;
  border:1px solid #D4AF37;border-radius:30px;
  padding:10px 22px;font-size:14px;font-family:inherit;
  cursor:pointer;backdrop-filter:blur(10px);transition:all .3s;
}
.nav button:hover{background:#D4AF37;color:#0B1E33}
.nav button:disabled{opacity:.3;cursor:not-allowed}
.nav .counter{
  background:rgba(11,30,51,.9);color:#D4AF37;border-radius:30px;
  padding:10px 18px;font-family:monospace;font-size:13px;
  border:1px solid rgba(212,175,55,.4);
}
/* Toggle autoplay */
.nav .toggle{
  background:rgba(11,30,51,.9);color:#D4AF37;
  border:1px solid rgba(212,175,55,.4);border-radius:30px;
  padding:10px 16px;font-size:12px;cursor:pointer;
}
.nav .toggle.off{opacity:.4}
@media (max-width:600px){
  #progressWrap{bottom:60px;width:80%}
  .nav button{padding:8px 14px;font-size:12px}
  .nav .counter{padding:8px 12px;font-size:11px}
}
</style>
</head>
<body>

<div id="flipbook"></div>

<div id="progressWrap"><div id="progressBar"></div></div>

<div class="nav">
  <button id="btnPrev">قبلی ▶</button>
  <div class="counter" id="counter">۱ / ۵۹</div>
  <button id="btnNext">◀ بعدی</button>
  <button class="toggle" id="toggleAuto">⏸ توقف خودکار</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
/* ================= تنظیمات ================= */
var TOTAL_PAGES = 59;
var AUTO_DELAY = 11000;   /* زمان خودکار ورق زدن (میلی‌ثانیه) */
var MUSIC_FADED = false;
var autoPlaying = true;
var autoTimer = null;
var progressTimer = null;
var autoStartTime = 0;

/* ================= ساخت صفحات ================= */
var bookEl = document.getElementById('flipbook');
var html = '';

/* جلد (سخت) */
html += '<div class="page" data-density="hard"><img src="img-0001.jpg" alt="جلد"></div>';

/* صفحات میانی */
for (var i = 2; i <= TOTAL_PAGES - 1; i++) {
  var n = String(i).padStart(4, '0');
  html += '<div class="page"><img src="img-' + n + '.jpg" loading="lazy" alt="صفحه ' + i + '"></div>';
}

/* پشت جلد (سخت) */
var lastN = String(TOTAL_PAGES).padStart(4, '0');
html += '<div class="page" data-density="hard"><img src="img-' + lastN + '.jpg" alt="پایان"></div>';

bookEl.innerHTML = html;

/* ================= راه‌اندازی Flipbook ================= */
var pageFlip = new St.PageFlip(bookEl, {
  width: 500,
  height: 700,
  size: 'stretch',
  minWidth: 250,
  maxWidth: 620,
  minHeight: 350,
  maxHeight: 900,
  drawShadow: true,
  flippingTime: 900,
  usePortrait: true,      /* در موبایل: یک صفحه، در لپ‌تاپ/تبلت: دو صفحه */
  autoSize: true,
  maxShadowOpacity: 0.4,
  showCover: true,
  mobileScrollSupport: false,
  clickEventForward: true,
  useMouseEvents: true,
  swipeDistance: 30,
  showPageCorners: true,
  disableFlipByClick: false
});

pageFlip.loadFromHTML(document.querySelectorAll('.page'));

/* ================= ناوبری
