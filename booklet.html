<meta charset="UTF-8">

<title>کاتالوگ رستاک</title>

<style>
:root{
  --navy:#0B1E33;
  --gold:#D4AF37;
  --cream:#F5F0E6;
  --silver:#C0C0C0;
  --emerald:#0B3D2E;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100vh;width:100vw;overflow:hidden;
  background:linear-gradient(135deg,#0B1E33 0%,#1a2f4a 100%);
  font-family:'Vazirmatn',sans-serif;
  color:var(--cream);
}

/* ==================== صفحه کتاب ==================== */
#bookScreen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 2s ease;
}
#bookScreen.fade-out{opacity:0;pointer-events:none}

#flipbookContainer{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;padding:10px;
}
#flipbook{
  box-shadow:0 20px 70px rgba(0,0,0,.7);
  border-radius:4px;
}
.page{
  background:#fff;overflow:hidden;position:relative;
}
.page img{
  width:100%;height:100%;object-fit:contain;display:block;
  user-select:none;-webkit-user-drag:none;
}

/* ==================== Progress Bar ==================== */
#progressWrap{
  position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
  width:55%;max-width:420px;height:3px;
  background:rgba(255,255,255,.12);border-radius:3px;
  overflow:hidden;z-index:99;transition:opacity .8s ease;
}
#progressBar{
  height:100%;width:0;
  background:linear-gradient(90deg,#D4AF37,#E8D8A8);
  transition:width .15s linear;border-radius:3px;
}

/* ==================== ناوبری ==================== */
.nav{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;z-index:99;
  transition:opacity .8s ease;
}
.nav button{
  background:rgba(11,30,51,.9);color:#D4AF37;
  border:1px solid #D4AF37;border-radius:30px;
  padding:10px 22px;font-size:14px;font-family:inherit;
  font-weight:500;cursor:pointer;backdrop-filter:blur(10px);
  transition:all .3s ease;white-space:nowrap;
}
.nav button:hover:not(:disabled){background:#D4AF37;color:#0B1E33}
.nav button:disabled{opacity:.3;cursor:not-allowed}
.nav .counter{
  background:rgba(11,30,51,.9);color:#D4AF37;
  border-radius:30px;padding:10px 18px;
  font-family:'Montserrat',sans-serif;font-size:13px;
  border:1px solid rgba(212,175,55,.4);
  letter-spacing:1px;min-width:75px;text-align:center;
}
.nav .toggle{
  background:rgba(11,30,51,.9);color:#D4AF37;
  border:1px solid rgba(212,175,55,.4);border-radius:30px;
  padding:10px 16px;font-size:12px;cursor:pointer;min-width:120px;
}
.nav .toggle:hover{background:#D4AF37;color:#0B1E33}

/* ==================== صفحه پایان ==================== */
#endScreen{
  position:fixed;inset:0;z-index:200;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at center,#12294a 0%,var(--navy) 75%);
  padding:40px 24px;
  text-align:center;
  opacity:0;
  transition:opacity 2s ease;
}
#endScreen.show{display:flex}
#endScreen.fade-in{opacity:1}

#endScreen::before{
  content:'';
  position:absolute;inset:0;
  background:url('logo-gold.png') center center no-repeat;
  background-size:50% auto;
  opacity:0.05;
  pointer-events:none;
}

.end-logo{
  width:130px;height:auto;
  margin-bottom:36px;
  filter:drop-shadow(0 8px 40px rgba(212,175,55,.5));
  animation:endLogoIn 2.4s cubic-bezier(.2,.8,.2,1) both;
  position:relative;z-index:1;
}
.end-slogan{

  position:relative;z-index:1;
}
