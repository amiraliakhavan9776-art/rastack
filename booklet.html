<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کاتالوگ الکترونیک | مهندسین مشاور رستاک</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  background:#1a1a1a;
  height:100vh;
  width:100vw;
  overflow:hidden;
  font-family:'Vazirmatn',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
#flipbook-container{
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}
#book{
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}
.page{
  background:#fff;
  overflow:hidden;
}
.page img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.page-cover img{
  object-fit:cover;
}

/* شماره صفحه */
.page-number{
  position:absolute;
  bottom:6px;
  font-size:11px;
  color:#999;
  font-family:'Montserrat',sans-serif;
}
.page[data-density="hard"] .page-number{display:none}

/* دکمه‌های ناوبری */
.nav{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  align-items:center;
  z-index:99;
}
.nav button{
  background:rgba(11,30,51,.9);
  color:#D4AF37;
  border:1px solid #D4AF37;
  border-radius:30px;
  padding:10px 22px;
  font-size:14px;
  font-family:inherit;
  cursor:pointer;
  backdrop-filter:blur(10px);
  transition:all .3s;
}
.nav button:hover{background:#D4AF37;color:#0B1E33}
.nav button:disabled{opacity:.3}
.nav .counter{
  background:rgba(11,30,51,.9);
  color:#D4AF37;
  border-radius:30px;
  padding:10px 18px;
  font-family:'Montserrat',sans-serif;
  font-size:13px;
  border:1px solid rgba(212,175,55,.4);
}
@media (max-width:600px){
  .nav button{padding:8px 16px;font-size:12px}
  .nav .counter{padding:8px 14px;font-size:11px}
}
</style>
</head>
<body>

<div id="flipbook-container">
  <div id="book"></div>
</div>

<div class="nav">
  <button id="btnPrev" onclick="prevPage()">قبلی ▶</button>
  <div class="counter" id="counter">۱ / ۵۹</div>
  <button id="btnNext" onclick="nextPage()">◀ بعدی</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

pagesHTML += '</div>';

pageFlip.loadFromHTML(document.querySelectorAll('.page'));
